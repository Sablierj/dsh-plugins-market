<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Session Model Bridge">
  <defs>
    <linearGradient id="smb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7dff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#smb-bg)"/>
  <!-- bridge deck -->
  <path d="M10 40h44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- pylons -->
  <path d="M20 40V27M44 40V27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- cables -->
  <path d="M20 27c6 5 18 5 24 0" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- outbound arrow: the bridged model leaving the machine -->
  <path d="M31 50h14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M41 45.5 47 50l-6 4.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>